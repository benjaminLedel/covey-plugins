name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  entries:
    name: entries and digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema

      # Schema, cross-checks, and every artefact fetched and matched against
      # its digest. This is the gate that makes third-party hosting safe.
      - name: Validate entries and verify artefacts
        run: python3 scripts/build_catalog.py --verify --out /tmp/catalog.json

      # catalog.json is generated on main — a pull request that edits it by
      # hand would be silently overwritten, so say so instead.
      - name: catalog.json must not be edited by hand
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx 'catalog.json'; then
            echo "::error file=catalog.json::catalog.json is generated by CI — remove it from this pull request"
            exit 1
          fi

  lint:
    name: covey plugin lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one implementation of the artefact check lives in the covey binary
      # — the same code an instance runs at install time. Until a release ships
      # `covey plugin lint`, this job reports and passes rather than pretending
      # to check something.
      - name: Fetch the covey binary
        id: covey
        run: |
          set -euo pipefail
          url=$(curl -sSL https://api.github.com/repos/benjaminLedel/covey/releases/latest \
                | python3 -c 'import json,sys; r=json.load(sys.stdin); print(next((a["browser_download_url"] for a in r.get("assets",[]) if a["name"].endswith("linux-amd64")), ""))')
          if [ -z "$url" ]; then
            echo "::notice::no covey release asset available yet — skipping lint"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sSL -o /usr/local/bin/covey "$url"
          chmod +x /usr/local/bin/covey
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Lint every listed artefact
        if: steps.covey.outputs.available == 'true'
        run: |
          set -euo pipefail
          urls=$(python3 - <<'PY'
import glob, json
for f in sorted(glob.glob("plugins/*.json")):
    entry = json.load(open(f))
    for v in entry.get("versions") or []:
        print(v["url"])
PY
)
          fail=0
          for url in $urls; do
            curl -sSL -o /tmp/artefact.json "$url"
            echo "== $url"
            covey plugin lint /tmp/artefact.json || fail=1
          done
          exit $fail
